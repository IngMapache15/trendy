name: Monitor Calendario Trendy

on:
  schedule:
    - cron: "0 * 5-15 11 *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba (manda una notificación y revisa una vez)"
        type: boolean
        default: true

concurrency:
  group: monitor-trendy
  cancel-in-progress: true

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Revisar tienda
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVALO_SEG: "45"
          DURACION_MIN: "90"
          MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '1' || '0' }}
        run: python monitor.py
